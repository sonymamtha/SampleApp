<main class="container">
  <h1>TV Shows</h1>

  <p *ngIf="loading">Loading TV shows...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <ng-container *ngIf="!loading && !error">
    <div class="search-box">
      <label for="searchTerm">Search TV shows:</label>
      <input
        id="searchTerm"
        type="text"
        placeholder="Type a show name..."
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchChange($event)" />
    </div>

    <div class="page-size">
      <label for="pageSize">Shows per page:</label>
      <select id="pageSize" [ngModel]="pageSize" (ngModelChange)="onPageSizeChange($event)">
        <option [ngValue]="1">1</option>
        <option [ngValue]="2">2</option>
        <option [ngValue]="5">5</option>
      </select>
    </div>

    <p *ngIf="filteredShows.length === 0" class="no-results">
      Sorry, couldn't find your TV show.
    </p>

    <div class="show-card" *ngFor="let show of pagedShows">
      <h2>{{ show.name }}</h2>
      <table class="cast-table">
        <thead>
          <tr>
            <th>Cast Member</th>
            <th>Birthday</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let member of show.cast">
            <td>{{ member.name }}</td>
            <td>{{ member.birthday | date:'mediumDate' }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav class="pagination" *ngIf="totalPages > 1 && filteredShows.length > 0">
      <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">Prev</button>
      <button
        *ngFor="let page of pageNumbers"
        (click)="goToPage(page)"
        [class.active]="page === currentPage">
        {{ page }}
      </button>
      <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">Next</button>
    </nav>
  </ng-container>
</main>
